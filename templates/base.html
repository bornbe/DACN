<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}OWASP Web Vulnerability Scanner{% endblock %}</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body class="bg-light d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ url_for('reports.dashboard_page') }}">
        <span class="brand-shield">OWASP</span>
        <span>Automated Web Scanner</span>
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNavbar"
        aria-controls="mainNavbar"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('reports.dashboard_page') }}">Bảng điều khiển (Dashboard)</a>
          </li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <span id="navUserBadge" class="badge bg-secondary d-none"></span>
          <button id="navLogoutBtn" type="button" class="btn btn-outline-light btn-sm d-none">
            Đăng xuất
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1 py-4">
    <div class="container">
      <div id="globalAlertBox" class="alert d-none" role="alert"></div>
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="bg-white border-top py-3 mt-auto">
    <div class="container d-flex flex-wrap justify-content-between align-items-center text-muted small">
      <span>Hệ thống Kiểm thử Thâm nhập Web Tự động dựa trên OWASP (Lab Localhost Scope Only)</span>
      <span>Module 6 — Web Dashboard &amp; Technical Reporting</span>
    </div>
  </footer>

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
    crossorigin="anonymous"
  ></script>
  <script src="{{ url_for('static', filename='js/chart.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts_extra %}{% endblock %}
</body>
</html>
