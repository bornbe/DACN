<!doctype html>
<html lang="vi">
<head>
  <!-- Issue #6.1: shared Bootstrap layout for the lab dashboard. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bảng điều khiển quét bảo mật cho môi trường lab được ủy quyền.">
  <title>{% block title %}DACN Lab Scanner{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <script src="{{ url_for('static', filename='js/chart.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/">DACN <span class="text-info">Lab Scanner</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
              aria-controls="mainNavbar" aria-expanded="false" aria-label="Mở menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavbar">
        <div class="navbar-nav me-auto">
          <a class="nav-link" href="/">Tổng quan</a>
        </div>
        <div class="d-flex align-items-center gap-3">
          <span id="current-user" class="navbar-text small"></span>
          <button id="logout-button" class="btn btn-sm btn-outline-light d-none" type="button">Đăng xuất</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4 py-lg-5">
    <div id="app-alert" class="alert d-none" role="alert" aria-live="polite"></div>
    {% block content %}{% endblock %}
  </main>

  <footer class="container pb-4 text-center text-secondary small">
    Chỉ sử dụng trên hệ thống lab được phép kiểm thử.
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
